name: Verify & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax & Build Check
        run: |
          node --check mobile/app.mjs
          node --check mobile/sw.js
          node --check mobile/legislation_data.mjs
          npm run build
          test -f mobile/dist/index.html
          test -f mobile/dist/app.mjs
          test -f mobile/dist/legislation_data.mjs
          test -f mobile/dist/sw.js
          test -f mobile/dist/manifest.webmanifest
          test -f mobile/dist/icon.svg
          test -f mobile/dist/icon-192.png
          test -f mobile/dist/icon-512.png
          test -f mobile/dist/logo-dark.png
          test -f mobile/dist/logo-light.png
          test -f mobile/dist/logo-white.png
          test -f mobile/dist/.nojekyll

      - name: Locate or install headless browser
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
            /usr/bin/google-chrome --version || true
          elif [ -x /usr/bin/chromium ]; then
            echo "CHROME_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
            /usr/bin/chromium --version || true
          elif [ -x /usr/bin/chromium-browser ]; then
            echo "CHROME_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
            /usr/bin/chromium-browser --version || true
          else
            sudo apt-get update && sudo apt-get install -y chromium-browser
            echo "CHROME_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
            /usr/bin/chromium-browser --version || true
          fi

      - name: Run 19 headless Chromium E2E tests
        run: npm test

      - name: Upload built web bundle artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
