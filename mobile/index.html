<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#e8e8e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Stick the Ticket</title>
</head>
<body>
  <div class="shell">
    <canvas id="screen" aria-label="Stick the Ticket POA charge browser"></canvas>
    <input id="search-input" class="search-overlay" type="text" inputmode="search" enterkeyhint="search" name="stt_poa_search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search POA charges" hidden>
    <p id="loading" role="status">Opening Stick the Ticket…</p>
    <div id="auth-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <form id="auth-form" class="modal-card" novalidate>
        <div class="modal-head">
          <div>
            <h2 id="auth-modal-title" class="modal-title">Officer Sign In</h2>
            <p id="auth-modal-subtitle" class="modal-subtitle">Save charges, element checks, and legislation picks locally.</p>
          </div>
          <button id="auth-close" type="button" class="modal-close" aria-label="Close sign in dialog">×</button>
        </div>
        <div class="modal-tabs" role="tablist">
          <button id="auth-mode-signin" type="button" class="modal-tab active" data-mode="signin">Sign In</button>
          <button id="auth-mode-create" type="button" class="modal-tab" data-mode="create">Create Profile</button>
        </div>
        <label class="field-label" for="auth-username">Officer Name or Username</label>
        <input id="auth-username" class="field-input" type="text" autocomplete="username" maxlength="32" placeholder="e.g. Ofc. Miller" required>
        <div id="auth-badge-wrap">
          <label class="field-label" for="auth-badge">Badge / Unit # (optional)</label>
          <input id="auth-badge" class="field-input" type="text" maxlength="16" placeholder="e.g. 412">
        </div>
        <label class="field-label" for="auth-pin">Passcode / PIN (optional)</label>
        <input id="auth-pin" class="field-input" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="Optional PIN">
        <label id="auth-carry-wrap" class="field-check" hidden>
          <input id="auth-carry" type="checkbox" checked>
          <span id="auth-carry-label">Keep current guest saved work</span>
        </label>
        <p id="auth-error" class="modal-error" role="alert" hidden></p>
        <div class="modal-actions">
          <button id="auth-cancel" type="button" class="btn-secondary">Cancel</button>
          <button id="auth-submit" type="submit" class="btn-primary">Sign In</button>
        </div>
      </form>
    </div>
    <input id="import-backup-input" type="file" accept=".json,application/json" hidden>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
